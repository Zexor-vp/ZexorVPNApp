[package]
name = "zexor-vpn-core"
description = "Платформонезависимое ядро: разбор подписки, сборка xray-конфига, блок-листы, управление процессом и системным прокси"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
url = "2"
percent-encoding = "2"
base64 = "0.22"
tracing = "0.1"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    # CreateJobObjectW принимает SECURITY_ATTRIBUTES, поэтому нужна и эта фича.
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_Networking_WinInet",
] }

[dev-dependencies]
pretty_assertions = "1"
