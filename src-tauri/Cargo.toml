[package]
name = "zexor-vpn-desktop"
version = "0.1.0"
description = "Zexor VPN desktop client for Windows"
edition = "2021"
rust-version = "1.77"

[lib]
name = "zexor_vpn_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
zexor-vpn-core = { path = "../core" }

tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
# Перезапуск приложения после установки обновления кнопкой "Проверить обновления".
tauri-plugin-process = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Только для запроса содержимого подписки (sub.zexorvpn.site) — сам API-клиент
# кабинета живёт в zexor-vpn-core.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# Хранилище refresh-токена: Windows Credential Manager.
keyring = { version = "3", features = ["windows-native"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
pretty_assertions = "1"
