name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  # Версия ядра, которое кладётся в инсталлятор. Обновлять осознанно:
  # сборка должна быть воспроизводимой, поэтому latest здесь намеренно не используется.
  XRAY_VERSION: v26.9.9
  # Драйвер виртуального адаптера для режима TUN (xray подгружает wintun.dll рядом с собой).
  WINTUN_VERSION: '0.14.1'

jobs:
  # Тесты ядра гоняем на Linux — они не зависят от платформы и это дешевле и быстрее,
  # чем поднимать windows-раннер (он тарифицируется с множителем x2).
  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - uses: Swatinem/rust-cache@v2

      - name: Тесты ядра
        run: |
          set -o pipefail
          cargo test -p zexor-vpn-core --all-features 2>&1 | tee core-tests.log

      # Журналы Actions без входа в GitHub не прочитать — хвост журнала тестов кладём в ветку ci-logs-core.
      - name: Журнал тестов в ветку ci-logs-core
        if: failure()
        run: |
          mkdir -p /tmp/ci-logs
          tail -n 400 core-tests.log > /tmp/ci-logs/core-tests.log || true
          echo "commit ${GITHUB_SHA}" > /tmp/ci-logs/README.txt
          cd /tmp/ci-logs
          git init -q
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout -q -b ci-logs-core
          git add .
          git commit -q -m "core tests log for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs-core

      - name: Установка mingw для кросс-компиляции
        # ring (зависимость reqwest/rustls) собирает C-код своим build-script'ом
        # даже под простой `cargo check` — без кросс-компилятора шаг ниже падает.
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Проверка Windows-специфичного кода
        # Реестр и Job Object не компилируются под Linux, но проверить их типы
        # можно кросс-таргетом — без этого ошибки всплывают только на релизной сборке.
        run: cargo check -p zexor-vpn-core --target x86_64-pc-windows-gnu

      - name: Форматирование и линт
        run: |
          cargo fmt --all -- --check
          cargo clippy -p zexor-vpn-core -- -D warnings

  build-windows:
    needs: test-core
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          # core/ и src-tauri/ — один Cargo-workspace с общим target/ в корне репо
          # (а не в src-tauri/, как было до объединения в workspace).
          workspaces: '. -> target'

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Установка зависимостей фронтенда
        run: npm ci

      - name: Загрузка xray-core
        shell: pwsh
        run: |
          $url = "https://github.com/XTLS/Xray-core/releases/download/$env:XRAY_VERSION/Xray-windows-64.zip"
          Write-Host "Скачиваю $url"
          Invoke-WebRequest -Uri $url -OutFile xray.zip
          Expand-Archive -Path xray.zip -DestinationPath xray-tmp -Force
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          # Tauri ищет sidecar по имени с target triple.
          Copy-Item xray-tmp/xray.exe src-tauri/binaries/xray-x86_64-pc-windows-msvc.exe
          # geosite/geoip нужны для правил geoip:private и geosite:* в конфиге.
          Copy-Item xray-tmp/geosite.dat src-tauri/resources/
          Copy-Item xray-tmp/geoip.dat src-tauri/resources/

      - name: Загрузка wintun (драйвер TUN)
        shell: pwsh
        run: |
          $url = "https://www.wintun.net/builds/wintun-$env:WINTUN_VERSION.zip"
          Write-Host "Скачиваю $url"
          Invoke-WebRequest -Uri $url -OutFile wintun.zip
          Expand-Archive -Path wintun.zip -DestinationPath wintun-tmp -Force
          Copy-Item wintun-tmp/wintun/bin/amd64/wintun.dll src-tauri/resources/

      - name: Сборка приложения и инсталлятора
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Ключ подписи обновлений. Без него updater откажется принимать релиз.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Релиз создаётся только для тегов; обычные пуши просто проверяют сборку.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: 'Zexor VPN ${{ github.ref_name }}'
          releaseBody: 'Автосборка. Установщик для Windows приложен ниже.'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --target x86_64-pc-windows-msvc

      - name: Артефакты сборки
        uses: actions/upload-artifact@v4
        with:
          name: zexor-vpn-windows
          path: |
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          if-no-files-found: warn
