name: android

on:
  push:
    branches: [main]
    tags: ['v*']

env:
  # Версия ядра, которое кладётся в APK (сборка для Android: Xray-android-arm64-v8a.zip).
  XRAY_VERSION: v26.9.9
  NDK_VERSION: 27.2.12479018

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Образ ubuntu-latest уже содержит Android SDK (ANDROID_HOME), докладываем нужные платформу и NDK.
      - name: Android SDK и NDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          SDKMANAGER="$(command -v sdkmanager || echo "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager")"
          yes | "${SDKMANAGER}" --licenses >/dev/null 2>&1 || true
          "${SDKMANAGER}" --install "platforms;android-35" "build-tools;35.0.0" "ndk;${NDK_VERSION}" 2>&1 | tail -5 | tee android-sdk.log
          echo "NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Установка зависимостей фронтенда
        run: npm ci

      - name: Каркас Android-проекта
        run: npx tauri android init --ci 2>&1 | tee android-init.log

      # Иконка приложения: `tauri android init` подставляет стандартный значок Tauri — перекрываем его нашим набором
      # из src-tauri/icons/android и стираем всё, что осталось от шаблона (иначе остаются чужие векторные слои).
      - name: Иконка приложения
        run: |
          RES=src-tauri/gen/android/app/src/main/res
          {
            echo "== до замены"; find "$RES" -iname "ic_launcher*" | sort
            rm -rf "$RES"/mipmap-*/ic_launcher* "$RES"/drawable*/ic_launcher* "$RES"/values/ic_launcher_background.xml
            cp -r src-tauri/icons/android/. "$RES"/
            echo "== после замены"; find "$RES" -iname "ic_launcher*" | sort
            sha256sum "$RES/mipmap-xxxhdpi/ic_launcher.png" src-tauri/icons/android/mipmap-xxxhdpi/ic_launcher.png
          } 2>&1 | tee android-icon.log

      # xray для Android кладём в Android-модуль плагина: .so-файл в jniLibs распаковывается на диск, и
      # приложение запускает его как обычный исполняемый файл; базы geoip/geosite — в ресурсы APK.
      - name: xray-core для Android
        run: |
          PLUGIN=tauri-plugin-zexor-vpn/android/src/main
          mkdir -p "$PLUGIN/jniLibs/arm64-v8a" "$PLUGIN/assets/geo"
          curl -fsSL -o /tmp/xray-android.zip "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/Xray-android-arm64-v8a.zip"
          unzip -o -q /tmp/xray-android.zip -d /tmp/xray-android
          cp /tmp/xray-android/xray "$PLUGIN/jniLibs/arm64-v8a/libxray.so"
          cp /tmp/xray-android/geoip.dat /tmp/xray-android/geosite.dat "$PLUGIN/assets/geo/"
          ls -la "$PLUGIN/jniLibs/arm64-v8a" "$PLUGIN/assets/geo"

      # Сгенерированный Gradle-проект приложения: нативные библиотеки нужно распаковывать на диск.
      - name: Gradle — распаковка нативных библиотек
        run: |
          python3 - <<'PY'
          import re
          p = "src-tauri/gen/android/app/build.gradle.kts"
          s = open(p).read()
          if "useLegacyPackaging" not in s:
              s = s.replace("android {", "android {\n    packaging { jniLibs { useLegacyPackaging = true } }", 1)
              open(p, "w").write(s)
          print(s[:600])
          PY

      - name: Сборка APK
        run: npx tauri android build --apk --target aarch64 2>&1 | tee android-build.log

      # Подпись: если в секретах репозитория есть постоянный ключ (ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD,
      # ANDROID_KEY_ALIAS) — подписываем им, и обновления встают поверх прежней версии. Иначе ключ создаётся
      # на лету: APK ставится, но каждую новую версию придётся ставить, удалив предыдущую.
      - name: Подпись APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SEED: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          KS_TYPE=""
          BT="${ANDROID_HOME}/build-tools/35.0.0"
          UNSIGNED="$(find src-tauri/gen/android/app/build/outputs/apk -name '*unsigned*.apk' | head -n 1)"
          echo "unsigned: ${UNSIGNED}"
          if [ -n "${KS_B64}" ]; then
            echo "${KS_B64}" | base64 -d > /tmp/zexor.jks
            PASS="${KS_PASS}"; ALIAS="${KS_ALIAS:-zexor}"
            echo "ключ: из секретов" | tee android-sign.log
          else
            # Постоянный ключ без ручных секретов: файл ключа лежит в отдельной ветке android-keystore этого
            # репозитория, а пароль выводится из секрета TAURI_SIGNING_PRIVATE_KEY (его знает только CI).
            # Без этого пароля файл бесполезен; сам ключ создаётся один раз, и все следующие сборки подписываются им,
            # поэтому Android ставит новые версии поверх старых.
            [ -n "${SEED}" ] || { echo "::error::секрет TAURI_SIGNING_PRIVATE_KEY недоступен"; exit 1; }
            PASS="$(printf 'zexor-android-keystore-v1' | openssl dgst -sha256 -hmac "${SEED}" -binary | base64 -w0 | tr -d '=+/' | cut -c1-40)"
            echo "::add-mask::${PASS}"
            ALIAS="zexor"; KS_TYPE="pkcs12"
            fetch_keystore() {
              git fetch -q origin android-keystore 2>/dev/null && git show FETCH_HEAD:zexor-release.p12 > /tmp/zexor.jks 2>/dev/null
            }
            if fetch_keystore; then
              echo "ключ: постоянный (из ветки android-keystore)" | tee android-sign.log
            else
              keytool -genkeypair -keystore /tmp/zexor.jks -storetype PKCS12 -alias "${ALIAS}" -keyalg RSA -keysize 3072 \
                -validity 36500 -storepass "${PASS}" -keypass "${PASS}" -dname "CN=Zexor VPN" >/dev/null 2>&1
              WORK="$(mktemp -d)"
              cp /tmp/zexor.jks "${WORK}/zexor-release.p12"
              if (cd "${WORK}" && git init -q && git checkout -q -b android-keystore \
                    && git -c user.name=zexor-ci -c user.email=ci@zexor.site add zexor-release.p12 \
                    && git -c user.name=zexor-ci -c user.email=ci@zexor.site commit -q -m "Android signing key (encrypted)" \
                    && git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
                    && git push -q origin android-keystore); then
                echo "ключ: создан и сохранён в ветке android-keystore" | tee android-sign.log
              elif fetch_keystore; then
                # Параллельная сборка успела сохранить свой ключ раньше — берём его, чтобы подпись была единой.
                echo "ключ: постоянный (взят у параллельной сборки)" | tee android-sign.log
              else
                echo "::error::не удалось ни сохранить, ни получить постоянный ключ"
                exit 1
              fi
            fi
          fi
          VERSION="$(node -p "require('./package.json').version")"
          OUT="Zexor-VPN-${VERSION}-android-arm64.apk"
          "${BT}/zipalign" -p -f 4 "${UNSIGNED}" /tmp/aligned.apk
          "${BT}/apksigner" sign --ks /tmp/zexor.jks ${KS_TYPE:+--ks-type "${KS_TYPE}"} --ks-pass "pass:${PASS}" --key-pass "pass:${PASS}" --ks-key-alias "${ALIAS}" --out "${OUT}" /tmp/aligned.apk
          "${BT}/apksigner" verify --print-certs "${OUT}" 2>&1 | head -3 | tee -a android-sign.log
          ls -la "${OUT}" | tee -a android-sign.log
          echo "APK_PATH=${OUT}" >> "$GITHUB_ENV"

      - name: Проверка содержимого APK
        run: |
          set +e
          BT="${ANDROID_HOME}/build-tools/35.0.0"
          {
            echo "== файлы"; unzip -l "${APK_PATH}" | grep -E "libxray|geo/|classes|AndroidManifest|libzexor" | head -20
            echo "== иконка"; "${BT}/aapt2" dump badging "${APK_PATH}" 2>&1 | grep -E "application-icon|application-label:" | head -5
            ICON="$("${BT}/aapt2" dump badging "${APK_PATH}" 2>&1 | grep -oE "application-icon-[0-9]+:'[^']+'" | tail -1 | sed -E "s/.*:'(.*)'/\\1/")"
            echo "иконка в APK: ${ICON}"
            unzip -p "${APK_PATH}" "${ICON}" 2>/dev/null | sha256sum
            for f in src-tauri/icons/android/mipmap-*/ic_launcher.png; do echo "наш ${f}: $(sha256sum < "$f")"; done
            echo "== манифест"; "${BT}/aapt2" dump permissions "${APK_PATH}" 2>&1 | head -15
            echo "== сервис"; "${BT}/aapt2" dump xmltree --file AndroidManifest.xml "${APK_PATH}" 2>&1 | grep -iE "vpn|service|extractNativeLibs|minSdk|targetSdk" | head -15
          } 2>&1 | tee android-apk.log

      - uses: actions/upload-artifact@v4
        with:
          name: zexor-vpn-android
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

      - name: Приложить APK к релизу
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_PATH }}

      # Журналы сборки читать из интерфейса GitHub без входа нельзя, поэтому хвост журнала кладём в ветку ci-logs.
      - name: Журнал сборки в ветку ci-logs
        if: always()
        run: |
          mkdir -p /tmp/ci-logs
          for f in android-sdk.log android-init.log android-build.log android-sign.log android-apk.log android-icon.log; do
            [ -f "$f" ] && tail -n 1200 "$f" > "/tmp/ci-logs/$f" || true
          done
          echo "commit ${GITHUB_SHA}" > /tmp/ci-logs/README.txt
          cd /tmp/ci-logs
          git init -q
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout -q -b ci-logs
          git add .
          git commit -q -m "android build log for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs
