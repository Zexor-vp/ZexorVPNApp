name: android

on:
  push:
    branches: [main]
    tags: ['v*']

env:
  # Версия ядра, которое кладётся в APK (сборка для Android: Xray-android-arm64-v8a.zip).
  XRAY_VERSION: v26.9.9
  NDK_VERSION: 27.2.12479018

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Android SDK и NDK
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;${NDK_VERSION}" >/dev/null
          echo "NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Установка зависимостей фронтенда
        run: npm ci

      - name: Каркас Android-проекта
        run: npx tauri android init --ci 2>&1 | tee android-init.log

      - name: Сборка APK
        run: npx tauri android build --apk --debug --target aarch64 2>&1 | tee android-build.log

      - name: Найденные APK
        run: find src-tauri/gen/android -name '*.apk' -print

      - uses: actions/upload-artifact@v4
        with:
          name: zexor-vpn-android
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      # Журналы сборки читать из интерфейса GitHub без входа нельзя, поэтому хвост журнала кладём в ветку ci-logs.
      - name: Журнал сборки в ветку ci-logs
        if: always()
        run: |
          mkdir -p /tmp/ci-logs
          for f in android-init.log android-build.log; do
            [ -f "$f" ] && tail -n 1200 "$f" > "/tmp/ci-logs/$f" || true
          done
          echo "commit ${GITHUB_SHA}" > /tmp/ci-logs/README.txt
          cd /tmp/ci-logs
          git init -q
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout -q -b ci-logs
          git add .
          git commit -q -m "android build log for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs
